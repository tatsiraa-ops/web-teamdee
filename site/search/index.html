<!doctype html>
<html lang="th">
<head>
  {{> head}}
  <title>ผลการค้นหา | TEAMDEE</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="ค้นหาสินค้า คู่มือ และแบบเสื้อของ TEAMDEE จากชื่อสินค้า ชื่อแบบ หรือรหัสแบบ">
</head>
<body>
{{> siteHeader}}

<main id="main">
  <section class="wrap section">
    <nav class="crumb2" aria-label="เส้นทางหน้า"><a href="/">หน้าแรก</a><span aria-hidden="true">/</span><span aria-current="page">ผลการค้นหา</span></nav>
    <h1 class="t-display text-[clamp(28px,4vw,46px)] mt-6">ผลการค้นหา</h1>

    <form class="flex flex-wrap gap-2.5 mt-7 max-w-[560px]" id="searchForm" role="search" onsubmit="return false">
      <label class="sr-only" for="sq">ค้นหาชื่อสินค้า ชื่อแบบ หรือรหัสแบบ</label>
      <input class="input flex-1 min-w-[220px]" id="sq" name="q" type="search" placeholder="ค้นหา เช่น โปโล หรือ TD-0012" autocomplete="off">
      <button class="btn btn-ink" type="submit">ค้นหา</button>
    </form>

    <p class="t-sm mt-5 tabular-nums" id="searchCount" role="status" aria-live="polite"></p>

    <!-- ผลลัพธ์ที่เป็นหน้าเว็บ -->
    <div class="mt-9 hidden" id="pageResults">
      <h2 class="t-display text-[clamp(22px,2.6vw,30px)]">หน้าที่เกี่ยวข้อง</h2>
      <ul class="divide-y divide-line border-t-2 border-ink mt-4" id="pageList"></ul>
    </div>

    <!-- ผลลัพธ์ที่เป็นแบบเสื้อ -->
    <div class="mt-12 hidden" id="designResults">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <h2 class="t-display text-[clamp(22px,2.6vw,30px)]">แบบเสื้อ</h2>
        <a class="inline-flex items-center min-h-[44px] font-bold text-ink underline decoration-orange decoration-2 underline-offset-4 hover:decoration-ink" href="{{url 'designs'}}" id="allDesigns">ดูแบบเสื้อทั้งหมด &rarr;</a>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5 mt-5" id="designHits" data-line-url="{{site.lineUrl}}"></div>
    </div>

    <!-- ไม่พบ -->
    <div class="bg-shell border border-line rounded-plate p-7 md:p-9 mt-9 hidden" id="searchEmpty">
      <h2 class="t-display text-[clamp(22px,2.8vw,32px)]">ไม่พบผลลัพธ์สำหรับ <span id="emptyTerm" class="text-orange"></span></h2>
      <p class="t-lead mt-3 max-w-[52ch]">ลองเปลี่ยนคำค้น หรือดูแบบทั้งหมด ถ้ามีรูปที่ชอบอยู่แล้วส่งมาให้เราดูได้เลย</p>
      <div class="flex flex-wrap gap-3 mt-6">
        <a class="btn btn-line" href="{{url 'designs'}}">ดูแบบทั้งหมด</a>
        <a class="btn btn-orange" href="{{site.lineUrl}}" data-track="line">ส่งภาพอ้างอิงทางไลน์</a>
      </div>
    </div>

    <!-- ข้อมูลสำหรับสคริปต์ค้นหา · ไม่ต้องเรียก API -->
    <script type="application/json" id="searchIndex">
    {
      "pages": [
        {{#each products}}{"t":"{{this.name}}","d":"{{this.short}}","u":"{{url 'products' this.id}}","k":"สินค้า"},{{/each}}
        {{#each uses}}{"t":"เสื้อ{{this.name}}","d":"{{this.short}}","u":"{{url 'uses' this.id}}","k":"การใช้งาน"},{{/each}}
        {{#each guides}}{"t":"{{this.name}}","d":"{{this.who}}","u":"{{url 'guides' this.id}}","k":"คู่มือ"},{{/each}}
        {"t":"คำนวณราคาเบื้องต้น","d":"เลือกคอ จำนวน และออปชัน ดูงบประมาณโดยประมาณ","u":"{{url 'calculations'}}","k":"คู่มือ"},
        {"t":"แบบเสื้อทั้งหมด","d":"แกลเลอรีแบบเสื้อพร้อมรหัส","u":"{{url 'designs'}}","k":"แบบเสื้อ"},
        {"t":"ผลงานและรีวิว","d":"งานจริงที่ส่งมอบแล้วและเสียงลูกค้า","u":"{{url 'projects'}}","k":"ผลงาน"},
        {"t":"คำถามที่พบบ่อย","d":"คำตอบ 7 หมวดเรื่องสั่งทำเสื้อ","u":"{{url 'faq'}}","k":"ข้อมูล"},
        {"t":"รู้จักทีมดี","d":"เราเป็นใคร ทำงานอย่างไร","u":"{{url 'about'}}","k":"บริษัท"},
        {"t":"ติดต่อทีมดี","d":"ไลน์ โทร และฟอร์มเล่าโจทย์","u":"{{url 'contact'}}","k":"ติดต่อ"}
      ],
      "designs": [
        {{#each designs}}{"c":"{{this.code}}","g":"{{this.garmentName}}","t":"{{this.techName}}","col":"{{this.color}}","m":"{{this.meta}}","img":"{{this.img}}","s":"{{this.imgSmall}}"}{{#unless @last}},{{/unless}}{{/each}}
      ]
    }
    </script>
  </section>
</main>
{{> footer}}
<script type="module" src="/src/js/search-page.js"></script>
</body>
</html>
