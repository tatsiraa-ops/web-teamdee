const tiles=items=>items.map(([title,copy,image,id])=>`<article class="tile">${image?ph(image):''}<h3>${id?link(id,title):title}</h3><p>${copy}</p></article>`);
const hero=(title,desc,image,kicker='TEAMDEE',actions='')=>`<section class="wf-hero ${image?'':'plain'}"><div><div class="wf-kicker">${kicker}</div><h1>${title}</h1><p class="wf-lead">${desc}</p><div class="row">${actions}</div></div>${image?ph(image,'ภาพจริงหรือภาพแบบที่ระบุประเภทชัดเจน'):''}</section>`;
const table=(rows,head=['หัวข้อ','ข้อมูลประกอบการตัดสินใจ'])=>`<table class="spec"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const faq=items=>`<div class="faq">${items.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`;
const list=items=>`<ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const steps=items=>`<div class="steps">${items.map(([title,copy],i)=>`<div class="step"><span>0${i+1}</span><h3>${title}</h3><p>${copy}</p></div>`).join('')}</div>`;

const basicFAQ=[['ไม่มีแบบเริ่มคุยได้ไหม?','เริ่มจากโจทย์การใช้งาน จำนวน และวันใช้ พร้อมภาพอ้างอิงถ้ามี'],['ขั้นต่ำและราคาประมาณเท่าไร?','[ใส่ขั้นต่ำและเงื่อนไขราคาที่ตรวจสอบแล้วแยกตามสินค้า]'],['ใช้เวลาผลิตนานแค่ไหน?','[ระบุระยะเวลาและจุดเริ่มนับจริง] แจ้งวันที่ต้องการใช้เพื่อให้ตรวจแผนก่อนยืนยัน']];
function workPreview(context){return `<div class="split">${ph('ภาพลูกค้าใช้งานจริง','บริบท: '+context)}<div><span class="tag">พื้นที่ข้อมูลจริงที่ต้องเตรียม</span><h3>[ชื่อลูกค้า / โครงการ]</h3><p>โจทย์: [ความต้องการเฉพาะของงาน]</p><p>ทีมดีช่วย: [สิ่งที่ช่วยเลือกหรือจัดการ]</p><p>ผลลัพธ์: [สิ่งที่ยืนยันได้จากงานจริง]</p><p>[คำรีวิวและแหล่งที่ได้รับอนุญาต]</p>${link('works','ดูผลงานและรีวิว')}</div></div>`}
function productPage(id){const p=products[id];return hero(p.title,p.desc,p.image,'สินค้าและบริการ',(id==='printed'?btn('designs','ดูแบบเสื้อพิมพ์ลาย'):btn('works','ดูผลงานจริง'))+`<button class="button secondary" data-brief="${p.title}">ปรึกษาสินค้านี้</button>`)+`<div class="strip"><span>ขั้นต่ำ: [ยืนยันตามสินค้า]</span><span>เวลา: [ยืนยันตามสเปก]</span><span>ราคา: ตามจำนวนและรายละเอียด</span></div>`+(id==='printed'?section('เลือกแนวกราฟิกที่ชอบ',designTiles(demoDesigns.filter(d=>d[1]==='printed').slice(0,4)),{more:['designs','ดูแบบเสื้อพิมพ์ลายทั้งหมด']}):'')+(id==='printed'?section('เริ่มออกแบบได้ 3 ทาง',steps([['เลือกแบบที่มี','เริ่มจากแบบในแกลเลอรี'],['ส่งภาพอ้างอิง','ใช้ภาพหรือสเก็ตช์บอกแนวที่ชอบ'],['เริ่มจากโจทย์','เล่างานและคนใส่ให้ทีมดีช่วยคิด']])):'')+section(id==='oversize'?'ดูทรงก่อนเลือกไซซ์':id==='polo'?'รายละเอียดงานปักที่เลือกได้':'ปรับรายละเอียดให้เป็นทีมของคุณ',columns(tiles(p.features.map(([t,d])=>[t,d,'ภาพรายละเอียด '+t]))))+section('ผ้า ทรง ไซซ์ และออปชั่น',table(p.spec)+`<div class="row" style="margin-top:20px">${link('guide-fabric','ดูผ้า')}${link('guide-size','ตารางไซซ์และวิธีวัด')}</div>`,{soft:true})+(id==='polo'?section('ก่อนผลิต อนุมัติอะไรบ้าง?',steps([['ภาพ Mockup','ตรวจภาพรวมแบบ ตำแหน่ง และสเปก'],['ตัวอย่างงาน','[ชิ้นปักหรือเสื้อตัวอย่างตามเงื่อนไขจริง]'],['ใบสรุปงาน','ตรวจจำนวน ไซซ์ และรายละเอียดก่อนผลิต']])):'')+section('เสื้อนี้ใช้กับงานแบบไหนได้บ้าง?',useLinks(p.uses))+section('ตัวอย่างงานจริง',workPreview(p.title),{soft:true})+section('ราคาและขั้นตอนสั่ง',table([['ปัจจัยราคา','จำนวน ผ้า ทรง โลโก้ และรายละเอียดงาน'],['ข้อมูลเริ่มต้น','การใช้งาน จำนวนคร่าว ๆ และวันใช้'],['ก่อนเริ่มผลิต','ยืนยันแบบ สเปก จำนวน และเงื่อนไขชำระเงินจริง']])+`<p style="margin-top:20px">${link(p.guide,'ดูคู่มือสั่งทำฉบับเต็ม')}</p>`)+section('คำถามเกี่ยวกับ'+p.title,faq(basicFAQ))+CTA()}
function usePage(id){const u=uses[id];return hero(u.title,u.desc,'ภาพงานจริงในบริบทนี้','เลือกตามการใช้งาน',btn('contact','ปรึกษาโจทย์ของทีม')+btn('designs','ดูแบบเสื้อ',true))+section('งานของคุณใกล้เคียงแบบไหน?',columns(tiles(u.contexts.map(([t,d])=>[t,d,'ภาพบริบท '+t]))))+section('สินค้าแบบไหนเหมาะกับโจทย์นี้?',productLinks(u.products),{soft:true})+section('แนวกราฟิกเสื้อพิมพ์ลายสำหรับกลุ่มนี้',designTiles(demoDesigns.filter(d=>d[1]==='printed'&&d[2]===id)),{more:['designs','เลือกดูแบบเพิ่มเติม']})+section('งานจริงที่เกี่ยวข้อง',workPreview(u.title),{soft:true})+section('เตรียมข้อมูลเท่านี้ เริ่มคุยได้',steps(u.plan.map((x,i)=>[x,['ส่งสิ่งที่มีให้ทีมดีช่วยตรวจ','แยกรายการให้ชัดเพื่อลดการตกหล่น','ยืนยันร่วมกันก่อนเริ่มผลิต','แจ้งตั้งแต่ต้นเพื่อให้ตรวจแผนงาน'][i]])))+section('คำถามสำหรับงานกลุ่มนี้',faq(u.questions))+CTA('เริ่มวางแผน'+u.title+'กับทีมดี')}

const garment=(id,label)=>`<div class="v3-art" role="img" aria-label="${esc(label)}"><span class="v3-shirt ${id}"></span><small>${esc(label)}</small></div>`;
const rail=(id,label,content,extra='')=>`<div class="v3-rail-block ${extra}"><div class="v3-rail-controls"><span>${label}</span><div><button type="button" class="button secondary" data-rail="${id}" data-direction="-1" aria-label="เลื่อน${label}ย้อนกลับ">←</button><button type="button" class="button secondary" data-rail="${id}" data-direction="1" aria-label="เลื่อน${label}ถัดไป">→</button></div></div><div class="v3-rail" id="${id}" role="region" aria-label="${label}">${content}</div></div>`;
function realWorkRows(prefix='home'){
 return workGroups.map(g=>`<section class="v3-work-group"><h3>${g.title}</h3><p>${g.desc}</p>${rail(prefix+'-works-'+g.id,'ผลงาน'+g.title,g.items.map(([p,t,d],i)=>`<article class="v3-work-card"><button type="button" class="v3-image-button" data-work-detail="${g.id}:${i}">${garment(p,'ตำแหน่งภาพจริง: '+t)}<span>ขยายภาพและดูรายละเอียด ↗</span></button><h4>${t}</h4><p>${d}</p><span class="tag">${products[p].title}</span><button type="button" class="v3-text" data-brief="${esc(t+' — '+products[p].title)}">สนใจงานแนวนี้ →</button></article>`).join(''))}</section>`).join('');
}

function guideBlock(kind,data){if(kind==='steps')return steps(data);if(kind==='cards')return columns(tiles(data.map(([t,d])=>[t,d,'ภาพประกอบ '+t])));if(kind==='spec')return table(data);if(kind==='list')return list(data);if(kind==='fabrics')return columns(tiles([['[ผ้า A / รหัส]','สัมผัส / การทิ้งตัว / สินค้าที่ใช้ได้','ภาพผิวผ้าใกล้'],['[ผ้า B / รหัส]','สัมผัส / การทิ้งตัว / สินค้าที่ใช้ได้','ภาพผิวผ้าใกล้'],['[ผ้า C / รหัส]','สัมผัส / การทิ้งตัว / สินค้าที่ใช้ได้','ภาพผิวผ้าใกล้']]));if(kind==='sizes')return `<div class="filterbar"><label>สินค้า<select id="size-product">${productIDs.map(id=>`<option value="${id}">${products[id].title}</option>`).join('')}</select></label></div><h3 id="size-label" style="margin-top:20px">ตารางเสื้อโปโลปัก</h3>${table([['S','[ข้อมูลจริง]','[ข้อมูลจริง]'],['M','[ข้อมูลจริง]','[ข้อมูลจริง]'],['L','[ข้อมูลจริง]','[ข้อมูลจริง]']],['ไซซ์','ความกว้าง','ความยาว'])}<p class="hint">[ระบุหน่วย วิธีวัด และค่าคลาดเคลื่อนจริง] ตัวเลขยังไม่ใส่เพื่อไม่ให้ใช้ผิด</p>`;if(kind==='download')return ph('ตัวอย่างตารางหรือไฟล์ดาวน์โหลด')+`<p>${data}</p><button class="button secondary" data-download="${data}">ดูตำแหน่งไฟล์ดาวน์โหลด</button>`;return `<p>${data}</p>`}
